name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    name: terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform, opnsense]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: terraform fmt
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive
      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  packer:
    name: packer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.0"
      - name: packer fmt
        working-directory: packer
        run: packer fmt -check .
      - name: packer init
        working-directory: packer
        run: packer init .
      - name: packer validate
        working-directory: packer
        run: packer validate .

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # Invoke-ScriptAnalyzer has no -Include of its own (that parameter belongs to
          # Get-ChildItem) — filter the file list first, then pipe it in. This also keeps
          # PSScriptAnalyzerSettings.psd1 itself out of analysis, since -Path/-Recurse
          # alone would otherwise sweep it up as a .psd1 file.
          $files = @(Get-ChildItem -Path powershell -Recurse -Include *.ps1, *.psm1)
          if ($files.Count -eq 0) {
            Write-Output "::notice::No PowerShell scripts yet under powershell/ — nothing to analyze."
            exit 0
          }
          try {
            $results = @($files | Invoke-ScriptAnalyzer -Severity Error, Warning -Settings powershell/PSScriptAnalyzerSettings.psd1 -ErrorAction Stop)
          } catch {
            Write-Output "::error::PSScriptAnalyzer threw: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
            exit 1
          }
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) {
            Write-Output "::error::PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          }

  consistency:
    name: design consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: MACs and addresses match the design documents
        # The MAC is the interface between terraform/ and opnsense/ — change one
        # side alone and the guest boots unreachable, with nothing in a plan or a
        # validate run to say why. Nothing else in this harness catches that.
        run: python3 .github/scripts/check-design-consistency.py

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Relative links and heading anchors resolve
        # Was lycheeverse/lychee-action, which downloads a release binary on every
        # run and then only checked relative links anyway, because external ones
        # were excluded. It failed once on a TLS error during that download with
        # nothing wrong in the repository. This needs no network, and it also
        # checks "#anchor" targets, which the old invocation did not.
        run: python3 .github/scripts/check-markdown-links.py
