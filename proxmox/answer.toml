# Rendered by scripts/prepare-proxmox-iso.sh (envsubst-style ${VAR} placeholders
# from .env) and embedded into a prepared installer ISO by
# proxmox-auto-install-assistant — see the zero-touch decision in PLAN.md. The
# rendered file and the prepared ISO are both gitignored: this template is the
# only copy that ever reaches git, and it holds a password hash, not the
# plaintext.
#
# Schema: https://pve.proxmox.com/wiki/Automated_Installation

[global]
keyboard             = "de"
country              = "de"
fqdn                 = "pve.silab.internal"
mailto               = "admin@silab.internal"
timezone             = "Europe/Berlin"
root-password-hashed = "${PROXMOX_ROOT_PASSWORD_HASH}"

[network]
# The provider's own uplink, not a lab address — 10.10.10.1 is OPNsense's
# Management gateway, and OPNsense does not exist yet at install time (host-
# network SPIKE, PLAN.md). "from-dhcp" forbids every other network key, so
# there is no cidr/gateway/dns to set here at all. The host's own 10.10.10.2 on
# VLAN 10 is added afterward, by the host-side runner's first stage, once
# vmbr1 exists — see docs/network-design.md.
source = "from-dhcp"

[disk-setup]
filesystem = "ext4"
# "sda" is a placeholder — the real rented server's boot-disk device name is
# unconfirmed until Milestone 8 task 1 picks a specific product. Adjust
# scripts/prepare-proxmox-iso.sh's rendering or this file directly once known.
disk-list = ["sda"]

[first-boot]
source   = "from-iso"
ordering = "fully-up"
