title = "gitleaks config for the SI lab"

# Extends gitleaks' own default ruleset rather than replacing it.
[extend]
useDefault = true

[allowlist]
description = "Packer's build-time bootstrap Administrator password — not a secret"
regexes = [
  # Only lets Packer's WinRM communicator connect during a build; the real local_admin_password
  # is rotated in as the last provisioner step and never appears in any committed file.
  '''Pa\$\$w0rd-PackerBuild!''',
]
